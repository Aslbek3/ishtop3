# UstaTop — nginx
#
# Bitta domen ikki vazifani bajaradi:
#   /        -> statik fayllar (public/)
#   /api/    -> PocketBase API      (127.0.0.1:8090)
#   /_/      -> PocketBase admin UI (127.0.0.1:8090)
#
# Shu sababli CORS sozlash shart emas — frontend va API bir domenda.
#
# SSL qatorlarini Certbot o'zi qo'shadi:
#   certbot --nginx -d ustatop.duckdns.org

server {
    listen 80;
    server_name ustatop.duckdns.org;

    root /root/projects/ustatop/public;
    index index.html;

    # --- Statik sayt ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html keshlanmasin — yangi deploy darhol ko'rinsin
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # CSS/JS/rasm — uzoq kesh
    location ~* \.(css|js|png|jpg|jpeg|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # --- PocketBase API ---
    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;          # realtime (WebSocket)
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;                          # realtime ulanish uzilmasin
        client_max_body_size 10M;                         # usta rasmlari uchun
    }

    # --- PocketBase admin paneli ---
    location /_/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
